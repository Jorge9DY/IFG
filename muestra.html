<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gremio de héroes — muestra del apartado gráfico</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1d1f; overflow: hidden; }
      .marco { position: fixed; inset: 0; }
      #lienzo { width: 100%; height: 100%; display: block; filter: saturate(0.82) contrast(1.04); }
      #pie { position: fixed; left: 10px; bottom: 8px; font: 11px monospace; color: #9aa0a6; }
    </style>
  </head>
  <body>
    <!-- Página de prueba de la fase 1 (docs/direccion-de-arte.md). No forma parte del juego.
         Parámetros: ?vista=sala|escena|caras|animaciones|rendimiento &cara=A|B|C &pixel=0|1 &contorno=0|1 -->
    <div class="marco">
      <canvas id="lienzo"></canvas>
      <div id="nombres" class="capa-nombres"></div>
      <div id="escena" class="capa-escena" hidden></div>
    </div>
    <div id="pie"></div>
    <script type="module" src="./src/muestra.ts"></script>
  </body>
</html>
